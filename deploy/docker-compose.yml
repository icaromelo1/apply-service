services:
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - valkey-data:/data
    networks:
      - apply-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scraper:
    build:
      context: ../scraper-go
    environment:
      VALKEY_URL: redis://valkey:6379
      GO_SCRAPER_ADDR: ":8081"
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - apply-net
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  apply:
    build:
      context: ../apply-service
    environment:
      SCRAPER_URL: http://scraper:8081
      TZ: America/Manaus
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AGY_BIN: ${AGY_BIN:-/usr/local/bin/agy}
      AGY_MODEL: ${AGY_MODEL:-Gemini 3.6 Flash (Low)}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      REVIEW_PASSWORD: ${REVIEW_PASSWORD:-}
      GUPY_AUTO_SUBMIT: ${GUPY_AUTO_SUBMIT:-false}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ../apply-service/profile:/app/profile
      - apply-data:/app/data
      - ${HOME}/.local/bin/agy:/usr/local/bin/agy:ro
      - ${HOME}/.gemini:/root/.gemini
    networks:
      - apply-net
      - web
    restart: unless-stopped
    depends_on:
      scraper:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.apply.rule=Host(`apply.icaromelodev.com.br`)
      - traefik.http.routers.apply.entrypoints=websecure
      - traefik.http.routers.apply.tls.certresolver=le
      - traefik.http.routers.apply.middlewares=apply-hsts
      - traefik.http.middlewares.apply-hsts.headers.forceSTSHeader=true
      - traefik.http.middlewares.apply-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.apply-hsts.headers.stsPreload=true
      - traefik.http.services.apply.loadbalancer.server.port=8090
      - traefik.docker.network=web

networks:
  apply-net:
    name: apply-net
  web:
    external: true

volumes:
  valkey-data:
  apply-data:
